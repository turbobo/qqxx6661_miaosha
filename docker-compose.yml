version: '3.8'

# 说明：宿主机端口统一错开（MySQL:3307 / Redis:6380 / RabbitMQ:5673/15673），
#      避免与本机其他项目的中间件（默认 3306/6379/5672）冲突；
#      容器之间通过服务名互通（mysql:3306 等），应用容器无需感知宿主机端口。
# 全套 Docker 启动（含应用）：docker compose up -d --build
# 仅启动中间件（应用本地 IDEA 运行）：docker compose up -d mysql redis rabbitmq

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: miaosha-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: m4a_miaosha
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本按文件名数字前缀顺序执行（仅首次创建数据卷时生效，已有数据卷不会重跑）
      # 顺序设计：01 建 ticket 体系与 user → 02 重建 stock/stock_order/user/order_record → 03 MQ 日志表 → 04 幂等唯一索引
      - ./sql/init_ticket_database.sql:/docker-entrypoint-initdb.d/01-init_ticket_database.sql:ro
      - ./sql/miaosha.sql:/docker-entrypoint-initdb.d/02-miaosha.sql:ro
      - ./sql/mq_message_log.sql:/docker-entrypoint-initdb.d/03-mq_message_log.sql:ro
      - ./sql/add_idempotent_index.sql:/docker-entrypoint-initdb.d/04-add_idempotent_index.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - miaosha-network
    # Windows 兼容：避免内存不足
    mem_limit: 1g

  # Redis 缓存
  redis:
    image: redis:6-alpine
    container_name: miaosha-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
    networks:
      - miaosha-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: miaosha-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      timeout: 20s
      retries: 10
    networks:
      - miaosha-network
    # Windows 兼容：避免内存不足
    mem_limit: 512m

  # 应用服务（全套 Docker 模式：docker compose up -d --build；日常开发也可只用 IDEA 本地启动）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miaosha-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/m4a_miaosha?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # JVM 内存设置（JAVA_TOOL_OPTIONS 由 JVM 自动读取；
      # 注意原 JAVA_OPTS 在 exec 形式 ENTRYPOINT 下不会生效）
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - miaosha-network
    mem_limit: 2g

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  miaosha-network:
    driver: bridge
