spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/m4a_miaosha?characterEncoding=utf-8&&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
mybatis.mapper-locations=classpath:/mapper/*.xml
server.port=8081

# ===== Tomcat 线程池调优 =====
server.tomcat.max-threads=300
server.tomcat.max-connections=1024
server.tomcat.accept-count=200

# ===== Redis 连接池扩容 =====
spring.redis.lettuce.pool.max-active=64
spring.redis.lettuce.pool.max-idle=32
spring.redis.lettuce.pool.min-idle=8
spring.redis.lettuce.pool.max-wait=3000ms

# ===== RabbitMQ 消费者调优 =====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=10
spring.rabbitmq.listener.simple.max-concurrency=20
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=false

# ===== 数据库连接池(HikariCP) =====
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ===== 分布式限流配置 =====
# 全局购票接口：桶容量5000，每秒补充5000令牌
ratelimit.global.purchase.max-tokens=5000
ratelimit.global.purchase.refill-rate=5000
# 用户级限流：桶容量5，每秒补充5令牌（单用户最多5req/s）
ratelimit.user.max-tokens=5
ratelimit.user.refill-rate=5
