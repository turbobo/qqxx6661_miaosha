# ===== IDEA 本地启动专用 profile（应用跑宿主机，中间件跑 Docker） =====
# 用法：IDEA 运行配置 Program arguments 加 --spring.profiles.active=local
# 或命令行：java -jar miaosha-web.jar --spring.profiles.active=local
#
# 背景：主 application.properties 默认指向本机原生中间件端口（3306/6379/5672），
# 而 Docker 中间件宿主机端口已错开为 3307/6380/5673，必须覆盖才能连通。
spring.datasource.url=jdbc:mysql://localhost:3307/m4a_miaosha?characterEncoding=utf-8&&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

spring.redis.host=localhost
spring.redis.port=6380

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
